# Edge roles: DaemonSet agent + cluster-receiver Deployment
# Both forward to the gateway Service (same pattern you have today).
# Image: docker.elastic.co/elastic-agent/elastic-otel-collector:9.5.4

# ---------------------------------------------------------------------------
# 1) otel-collector-agent  (DaemonSet)  -- node logs, kubelet, host metrics, app OTLP
# ---------------------------------------------------------------------------

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  filelog:
    include: [/var/log/pods/*/*/*.log]
    exclude: [/var/log/pods/*otel*/*/*.log]
    start_at: end
    include_file_path: true
    include_file_name: false
    operators:
      - type: container
        id: container-parser

  kubeletstats:
    auth_type: serviceAccount
    collection_interval: 60s
    endpoint: ${env:OTEL_K8S_NODE_NAME}:10250
    node: ${env:OTEL_K8S_NODE_NAME}
    insecure_skip_verify: true
    k8s_api_config:
      auth_type: serviceAccount
    metric_groups: [node, pod, container, volume]
    extra_metadata_labels: [container.id]

  hostmetrics:
    collection_interval: 60s
    root_path: /hostfs
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      network: {}
      load: {}
      disk: {}
      filesystem: {}

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20
  batch: {}
  batch/metrics:
    send_batch_max_size: 0
    timeout: 1s
  k8sattributes:
    filter:
      node_from_env_var: OTEL_K8S_NODE_NAME
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.deployment.name
        - k8s.node.name
        - k8s.container.name
        - service.name
  resource/hostname:
    attributes:
      - key: host.name
        from_attribute: k8s.node.name
        action: upsert

exporters:
  otlp/gateway:
    endpoint: ${env:GATEWAY_OTLP_ENDPOINT}
    tls:
      insecure: true
    compression: gzip

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, k8sattributes, resource/hostname, batch]
      exporters: [otlp/gateway]
    metrics:
      receivers: [otlp, kubeletstats, hostmetrics]
      processors: [memory_limiter, k8sattributes, resource/hostname, batch/metrics]
      exporters: [otlp/gateway]
    logs:
      receivers: [otlp, filelog]
      processors: [memory_limiter, k8sattributes, resource/hostname, batch]
      exporters: [otlp/gateway]

